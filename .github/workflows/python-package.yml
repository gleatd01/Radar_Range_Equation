# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: '3.x'
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: 'x64'
      # You can test your matrix by printing the current Python version
      - name: Install Hatch
        uses: pypa/hatch@install
      - name: Set version
        run: |
          VERSION=$(date -u +"%Y.%m.%d.dev1")
          echo "Building version: $VERSION"
          sed -i "s/^version = \"0.0.0\"/version = \"$VERSION\"/" pyproject.toml
      - name: Build package
        run: hatch build
      - name: Install package
        run: pip install dist/*.whl
      - name: Test package
        run: python python/test_package.py
      - name: Test equations and solvers
        run: python python/test_equations_solvers.py
      - name: Generate equation documentation
        run: python python/generate_equation_docs.py
      - name: Generate solver documentation
        run: python python/generate_solver_docs.py
      - name: Create badges
        run: |
          # Read test results and create badge data
          if [ -f test_results.json ]; then
            PASS_RATE=$(python3 -c "import json; data=json.load(open('test_results.json')); print(data.get('pass_rate', 0))")
            EQ_COUNT=$(python3 -c "import json; data=json.load(open('test_results.json')); print(data['equations']['total'])")
            SOLVER_COUNT=$(python3 -c "import json; data=json.load(open('test_results.json')); print(data['solvers']['total'])")
            
            # Determine badge color based on pass rate
            if [ $(echo "$PASS_RATE >= 90" | bc -l) -eq 1 ]; then
              COLOR="brightgreen"
            elif [ $(echo "$PASS_RATE >= 70" | bc -l) -eq 1 ]; then
              COLOR="yellow"
            else
              COLOR="red"
            fi
            
            echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
            echo "EQ_COUNT=$EQ_COUNT" >> $GITHUB_ENV
            echo "SOLVER_COUNT=$SOLVER_COUNT" >> $GITHUB_ENV
            echo "BADGE_COLOR=$COLOR" >> $GITHUB_ENV
            
            echo "Test Results: $PASS_RATE% pass rate"
            echo "Equations: $EQ_COUNT"
            echo "Solvers: $SOLVER_COUNT"
          fi
      - name: Upload package
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine upload dist/*
